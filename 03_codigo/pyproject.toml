[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seguridad-ciudadana"
version = "1.0.0"
description = "Prototipo de priorización preventiva de microzonas por turno a partir de incidencias del CCO de San Juan de Miraflores"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
seguridad-ciudadana = "seguridad_ciudadana.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seguridad_ciudadana = ["db/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "modelos", "reportes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# N803/N806: X e y mayúsculas son convención de ML. N818: excepciones con nombres en español (ErrorPesos…).
# B905: zip(strict=...) no aporta en este código (listas de igual largo construidas localmente).
ignore = ["N803", "N806", "N818", "B905"]

[tool.ruff.lint.pycodestyle]
# El formateador usa 120; se toleran hasta 140 en textos de interfaz y bloques `fmt: skip` alineados.
max-line-length = 140

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
